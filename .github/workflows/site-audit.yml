name: site-audit
on:
  push:
    branches: [site-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for u in https://www.mantrasports.ca/robots.txt; do echo "=== $u"; curl -sSL -o /tmp/b -w "status=%{http_code} final=%{url_effective} type=%{content_type}\n" "$u"; tail -c 400 /tmp/b; echo; done

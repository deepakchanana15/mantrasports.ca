name: site-audit
on:
  push:
    branches: [site-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 .audit/audit.py
      - run: for u in https://www.mantrasports.co.uk/robots.txt https://www.mantrasports.uk/robots.txt; do echo "=== $u"; curl -sSL -m 20 "$u" | head -c 500; echo; done

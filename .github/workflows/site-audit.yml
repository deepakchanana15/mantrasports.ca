name: site-audit
on:
  push:
    branches: [site-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for u in https://deepakchanana.com/ https://deepakchanana.com/robots.txt https://deepakchanana.com/sitemap.xml https://deepakchanana.com/sitemap_index.xml https://www.deepakchanana.com/; do echo "=== $u"; curl -sSL -o /tmp/b -w "status=%{http_code} final=%{url_effective} type=%{content_type}\n" "$u"; head -c 600 /tmp/b; echo; done

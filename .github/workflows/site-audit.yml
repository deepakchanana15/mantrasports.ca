name: site-audit
on:
  push:
    branches: [site-audit]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          curl -sSI https://deepakchanana.com/ | grep -iE "^(server|x-vercel|x-served|via|x-github|x-firebase|cf-ray|x-nf|platform|x-powered)" || true
          curl -sS https://deepakchanana.com/ | md5sum
          curl -sS https://raw.githubusercontent.com/deepakchanana15/Deepak-Chanana/main/index.html | md5sum
          dig +short deepakchanana.com A; dig +short deepakchanana.com NS
